<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f15a24"><title>Absensi Staff • Legacy Music Center</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f8fb;color:#17232d;min-height:100vh}.shell{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 26px) 18px 30px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.mark{width:52px;height:52px;border-radius:17px;background:#f15a24;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}.brand b{font-size:20px}.brand small{display:block;color:#718096;margin-top:3px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:24px;box-shadow:0 16px 38px rgba(23,35,45,.08)}h1{font-size:28px;margin:0 0 8px}p{color:#64748b;line-height:1.55}.icon{font-size:44px;margin-bottom:10px}.field{margin-top:18px}.field label{display:block;font-weight:800;margin-bottom:8px}.field input{width:100%;font-size:18px;padding:14px;border:1px solid #cbd5e1;border-radius:14px}.field input:focus{outline:0;border-color:#f15a24;box-shadow:0 0 0 3px rgba(241,90,36,.12)}button{width:100%;border:0;border-radius:15px;padding:15px 18px;font-size:17px;font-weight:850;cursor:pointer;margin-top:16px}.primary{background:#f15a24;color:#fff}.status{display:none;margin-top:18px;padding:14px;border-radius:14px;line-height:1.45}.status.show{display:block}.status.info{background:#eff6ff;color:#1d4ed8}.status.success{background:#ecfdf5;color:#047857}.status.error{background:#fff1f2;color:#be123c}.security{margin-top:18px;font-size:13px;color:#64748b;background:#f8fafc;border-radius:14px;padding:13px}.hidden{display:none!important}@media(max-width:420px){.card{padding:20px}}
</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"></head><body><main class="shell"><div class="brand"><div class="mark">L</div><div><b>Legacy Music Center</b><small>Absensi Staff Biometrik</small></div></div><section class="card"><div class="icon">🔐</div><div id="enrollView" class="hidden"><h1>Daftarkan Passkey</h1><p id="enrollText">Memeriksa link...</p><div class="field"><label>Nama perangkat</label><input id="deviceLabel" placeholder="Contoh: iPhone Afif"></div><button id="btnEnroll" class="primary" onclick="enroll()">Daftarkan Face ID / Touch ID</button></div><div id="attendanceView"><h1>Absen Staff</h1><p>Masukkan kode staff lalu verifikasi biometrik pada perangkat.</p><div class="field"><label>Kode Staff</label><input id="employeeCode" autocapitalize="characters" autocomplete="username" placeholder="STF-001"></div><button id="btnAttend" class="primary" onclick="attend()">Verifikasi Biometrik</button></div><div id="status" class="status"></div><div class="security"><b>Privasi:</b> Legacy tidak menyimpan sidik jari, Face ID, iris, atau foto wajah. Perangkat hanya mengirim bukti kriptografi WebAuthn.</div></section></main><script>
const q=new URLSearchParams(location.search),token=q.get('enroll')||'', $=id=>document.getElementById(id);function status(m,t='info'){const e=$('status');e.textContent=m;e.className='status show '+t}function b64d(v){v=v.replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';const s=atob(v),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}function b64e(buf){const a=new Uint8Array(buf);let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function prep(o){const p={...o};p.challenge=b64d(p.challenge);if(p.user?.id)p.user={...p.user,id:b64d(p.user.id)};if(p.excludeCredentials)p.excludeCredentials=p.excludeCredentials.map(x=>({...x,id:b64d(x.id)}));if(p.allowCredentials)p.allowCredentials=p.allowCredentials.map(x=>({...x,id:b64d(x.id)}));return p}async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify(body)}),j=await r.json();if(!j.ok)throw new Error(j.error||'Request gagal');return j.data}if(!window.PublicKeyCredential){status('Browser/perangkat belum mendukung Passkey. Gunakan Safari/Chrome terbaru.','error')}if(token){$('attendanceView').classList.add('hidden');$('enrollView').classList.remove('hidden');prepareEnroll()}async function prepareEnroll(){try{window.opt=await post('/api/staff-biometric/enroll/options',{token});$('enrollText').textContent='Pendaftaran untuk '+window.opt.staffName+'. Gunakan perangkat pribadi staff.';status('Link siap. Tekan tombol dan ikuti verifikasi biometrik.')}catch(e){status(e.message,'error');$('btnEnroll').disabled=true}}async function enroll(){const b=$('btnEnroll');try{b.disabled=true;b.textContent='Menunggu biometrik...';const d=window.opt||await post('/api/staff-biometric/enroll/options',{token}),c=await navigator.credentials.create({publicKey:prep(d.publicKey)}),r=c.response;if(typeof r.getPublicKey!=='function')throw new Error('Browser belum mendukung ekspor public key WebAuthn.');const payload={id:c.id,type:c.type,response:{clientDataJSON:b64e(r.clientDataJSON),authenticatorData:b64e(r.getAuthenticatorData()),publicKey:b64e(r.getPublicKey()),publicKeyAlgorithm:r.getPublicKeyAlgorithm(),transports:typeof r.getTransports==='function'?r.getTransports():[]}};const x=await post('/api/staff-biometric/enroll/finish',{token,deviceLabel:$('deviceLabel').value.trim(),credential:payload});status(x.message,'success');b.textContent='Passkey Terdaftar ✓'}catch(e){status(e.name==='NotAllowedError'?'Pendaftaran dibatalkan atau biometrik tidak selesai.':e.message,'error');b.disabled=false;b.textContent='Daftarkan Face ID / Touch ID'}}async function attend(){const b=$('btnAttend'),code=$('employeeCode').value.trim();if(!code)return status('Masukkan Kode Staff.','error');try{b.disabled=true;b.textContent='Menunggu biometrik...';const d=await post('/api/staff-biometric/auth/options',{employeeCode:code});status('Verifikasi '+d.staffName+' pada perangkat...');const c=await navigator.credentials.get({publicKey:prep(d.publicKey)}),r=c.response,payload={id:c.id,type:c.type,response:{clientDataJSON:b64e(r.clientDataJSON),authenticatorData:b64e(r.authenticatorData),signature:b64e(r.signature),userHandle:r.userHandle?b64e(r.userHandle):null}},x=await post('/api/staff-biometric/auth/verify',{staffId:d.staffId,credential:payload});status(d.staffName+': '+x.message,'success');b.textContent=x.action==='check-out'?'Absen Pulang Berhasil ✓':'Absen Masuk Berhasil ✓';setTimeout(()=>{b.disabled=false;b.textContent='Verifikasi Biometrik';$('employeeCode').value=''},2500)}catch(e){status(e.name==='NotAllowedError'?'Verifikasi dibatalkan atau gagal.':e.message,'error');b.disabled=false;b.textContent='Verifikasi Biometrik'}}
</script></body></html>
