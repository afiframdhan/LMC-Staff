<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f15a24"><title>Daftar Wajah Staff • Legacy</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f8fb;color:#17232d}.shell{max-width:620px;margin:auto;padding:24px 16px 40px}.brand{font-weight:900;font-size:21px;margin-bottom:16px}.brand span{color:#f15a24}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:20px;box-shadow:0 16px 40px rgba(23,35,45,.08)}h1{margin:0 0 6px;font-size:26px}.muted{color:#64748b;line-height:1.5}.cam{position:relative;margin:18px 0;background:#0f172a;border-radius:20px;overflow:hidden;aspect-ratio:3/4;max-height:560px}.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.guide{position:absolute;inset:15% 12%;border:3px solid rgba(255,255,255,.85);border-radius:45%;pointer-events:none}.status{padding:12px 14px;border-radius:14px;background:#eff6ff;color:#1d4ed8;margin:12px 0}.error{background:#fff1f2;color:#be123c}.success{background:#ecfdf5;color:#047857}button{width:100%;border:0;border-radius:15px;padding:15px;font-size:16px;font-weight:850;margin-top:10px;cursor:pointer}.primary{background:#f15a24;color:#fff}.secondary{background:#eef2f7;color:#334155}.danger{background:#fff1f2;color:#be123c}.hidden{display:none}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800}</style></head><body><main class="shell"><div class="brand"><span>Legacy</span> Music Center</div><section class="card"><h1>Daftar Wajah Staff</h1><div id="who" class="muted">Memuat data staff...</div><div class="status" id="status">Menyiapkan model pengenalan wajah...</div><div class="cam"><video id="video" autoplay muted playsinline></video><div class="guide"></div></div><div class="muted">Hadapkan wajah lurus ke kamera. Saat menekan daftar, sistem mengambil 5 sampel dan menyimpan <b>template/descriptor wajah</b>, bukan foto dari kamera.</div><button id="capture" class="primary" disabled>Daftarkan Wajah</button><button id="clear" class="danger hidden">Hapus Data Wajah</button><button class="secondary" onclick="location.href='/'">Kembali ke Dashboard</button></section></main><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><script>
const $=id=>document.getElementById(id),staffId=new URLSearchParams(location.search).get('staff')||'',token=localStorage.getItem('ls_access')||'';let stream=null,staff=null;
function setStatus(m,t=''){const e=$('status');e.textContent=m;e.className='status '+t}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+token,...(opt.headers||{})}}),j=await r.json().catch(()=>({ok:false,error:'Respons server tidak valid'}));if(!j.ok)throw new Error(j.error||'Request gagal');return j.data}
async function load(){if(!token){location.href='/';return}if(!staffId)throw new Error('Staff tidak dipilih.');const d=await api('/api/admin/dashboard');staff=d.staff.find(x=>String(x.staffId)===String(staffId));if(!staff)throw new Error('Staff tidak ditemukan.');$('who').innerHTML='<b>'+esc(staff.name)+'</b> • '+esc(staff.position)+' <span class="pill">'+esc(staff.employeeCode)+'</span>';$('clear').classList.toggle('hidden',!staff.faceEnrolled);setStatus('Memuat AI pengenalan wajah...');const model='https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js@0.22.2/weights';await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(model),faceapi.nets.faceLandmark68Net.loadFromUri(model),faceapi.nets.faceRecognitionNet.loadFromUri(model)]);setStatus('Membuka kamera depan...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false});$('video').srcObject=stream;await $('video').play();$('capture').disabled=false;setStatus(staff.faceEnrolled?'Wajah sudah terdaftar. Anda boleh mendaftarkan ulang.':'Siap. Pastikan hanya satu wajah terlihat di kamera.','success')}
async function getDescriptor(){const opt=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55});const det=await faceapi.detectSingleFace($('video'),opt).withFaceLandmarks().withFaceDescriptor();if(!det)throw new Error('Wajah tidak terdeteksi. Dekatkan wajah dan pastikan pencahayaan cukup.');return Array.from(det.descriptor)}
function avg(ds){const a=new Array(128).fill(0);for(const d of ds)for(let i=0;i<128;i++)a[i]+=d[i]/ds.length;const n=Math.sqrt(a.reduce((q,x)=>q+x*x,0))||1;return a.map(x=>x/n)}
$('capture').onclick=async()=>{try{$('capture').disabled=true;const ds=[];for(let i=1;i<=5;i++){setStatus('Mengambil sampel wajah '+i+'/5... tetap lihat kamera.');ds.push(await getDescriptor());await new Promise(r=>setTimeout(r,450))}setStatus('Menyimpan template wajah...');await api('/api/admin/staff/'+encodeURIComponent(staffId)+'/face',{method:'POST',body:JSON.stringify({descriptor:avg(ds),model:'face-api.js-0.22.2'})});staff.faceEnrolled=true;$('clear').classList.remove('hidden');setStatus('Wajah '+staff.name+' berhasil didaftarkan.','success')}catch(e){setStatus(e.message,'error')}finally{$('capture').disabled=false}};
$('clear').onclick=async()=>{if(!confirm('Hapus template wajah staff ini?'))return;try{await api('/api/admin/staff/'+encodeURIComponent(staffId)+'/face',{method:'DELETE'});staff.faceEnrolled=false;$('clear').classList.add('hidden');setStatus('Data wajah sudah dihapus.','success')}catch(e){setStatus(e.message,'error')}};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));load().catch(e=>setStatus(e.message,'error'));
</script></body></html>
